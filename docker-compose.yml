version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: taxwise_postgres
    environment:
      POSTGRES_USER: taxwise_user
      POSTGRES_PASSWORD: taxwise_password
      POSTGRES_DB: taxwise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxwise_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxwise_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://taxwise_user:taxwise_password@postgres:5432/taxwise_db
      SECRET_KEY: your-secret-key-change-in-production
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python main.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxwise_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: npm run dev

volumes:
  postgres_data:
