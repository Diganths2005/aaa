name: TaxWise validation

on:
  push:
    branches: ["main", "reliability-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_ai_tax_architecture.py
          - tests/test_chat_api.py
          - tests/test_deduction_discovery.py
          - tests/test_deduction_eligibility.py
          - tests/test_document_api.py
          - tests/test_document_extraction.py
          - tests/test_document_storage.py
          - tests/test_final_deduction_rules.py
          - tests/test_itr1.py
          - tests/test_itr_api.py
          - tests/test_itr_decision_engine.py
          - tests/test_itr_selection.py
          - tests/test_knowledge.py
          - tests/test_onboarding_api.py
          - tests/test_onboarding_engine.py
          - tests/test_profile_reliability.py
          - tests/test_tax_api.py
          - tests/test_tax_engine.py
          - tests/test_tax_engine_hardening.py
          - tests/test_tax_profile_schema.py
          - tests/test_what_if.py
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taxwise_user
          POSTGRES_PASSWORD: taxwise_password
          POSTGRES_DB: taxwise_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taxwise_user -d taxwise_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend test file
        env:
          DATABASE_URL: postgresql://taxwise_user:taxwise_password@localhost:5432/taxwise_db
          SECRET_KEY: ci-test-secret
          DOCUMENT_STORAGE_DIR: ${{ runner.temp }}/taxwise-documents
        run: python -m pytest -q ${{ matrix.test_file }} --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
