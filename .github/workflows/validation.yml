name: TaxWise validation

on:
  push:
    branches: ["main", "reliability-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_document_api.py::test_upload_process_and_confirm_updates_profile
          - tests/test_document_api.py::test_taxwise_import_template_populates_supported_profile_fields_after_confirmation
          - tests/test_document_api.py::test_full_profile_workbook_imports_profile_records_after_confirmation
          - tests/test_document_api.py::test_rejected_document_candidates_do_not_change_profile_and_are_not_reoffered
          - tests/test_document_api.py::test_document_access_is_isolated_by_user
          - tests/test_document_api.py::test_chat_retrieves_only_the_current_users_processed_document
          - tests/test_document_api.py::test_deleting_document_removes_it_from_chat_retrieval
          - tests/test_document_api.py::test_excel_upload_process_and_list_preserves_extracted_values
          - tests/test_document_api.py::test_excel_upload_accepts_browser_generic_mime_type
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend test
        env:
          DATABASE_URL: sqlite:///./tax-api-test.db
          SECRET_KEY: test-secret
          DOCUMENT_STORAGE_DIR: ${{ runner.temp }}/taxwise-documents
        run: python -m pytest -q ${{ matrix.test_file }} --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
