name: TaxWise validation

on:
  push:
    branches: ["main", "reliability-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_document_extraction.py::test_extracts_form16_candidates_from_pdf_text
          - tests/test_document_extraction.py::test_extracts_common_form16_labels_without_colons
          - tests/test_document_extraction.py::test_extracts_official_form16_salary_labels
          - tests/test_document_extraction.py::test_extracts_itr3_workbook_income_and_tax_rows
          - tests/test_document_extraction.py::test_extracts_personal_fields_from_pipe_delimited_workbook_rows
          - tests/test_document_extraction.py::test_import_template_reads_only_entered_values_and_ignores_instructions
          - tests/test_document_extraction.py::test_import_template_rejects_invalid_pan
          - tests/test_document_extraction.py::test_import_template_rejects_duplicate_fields
          - tests/test_document_extraction.py::test_full_profile_import_reads_scalar_and_repeating_profile_sheets
          - tests/test_document_extraction.py::test_full_profile_import_rejects_invalid_scalar_values
          - tests/test_document_extraction.py::test_parse_currency
          - tests/test_document_extraction.py::test_scanned_pdf_requires_ocr
          - tests/test_document_extraction.py::test_scanned_pdf_uses_ocr_fallback
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend test
        run: python -m pytest -q ${{ matrix.test_file }} --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
